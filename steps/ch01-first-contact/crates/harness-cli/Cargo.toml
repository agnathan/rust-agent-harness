[package]
name = "ch01-harness-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[[bin]]
name = "ch01-harness"
path = "src/main.rs"

[dependencies]
harness-core = { package = "ch01-harness-core", path = "../harness-core" }
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
