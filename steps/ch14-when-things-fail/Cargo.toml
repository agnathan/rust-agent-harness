[package]
name = "ch14-when-things-fail"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Chapter 14: classify a failure, retry inside the bound, fall back."

[lib]
name = "failures"

[[bin]]
name = "ch14-when-things-fail"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[[bench]]
name = "failures"
harness = false
