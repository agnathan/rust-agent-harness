[package]
name = "ch03-3-harness-cli"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
publish = false

[[bin]]
name = "ch03-3-harness"
path = "src/main.rs"

[dependencies]
harness-core = { package = "ch03-3-harness-core", path = "../harness-core" }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
rustyline = "14"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
