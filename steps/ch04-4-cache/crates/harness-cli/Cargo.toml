[package]
name = "ch04-4-harness-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[[bin]]
name = "ch04-4-harness"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ch04-4-harness-core = { path = "../harness-core" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
