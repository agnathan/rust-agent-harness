[package]
name = "ch13-sandbox"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
default-run = "ch13-sandbox"
description = "Chapter 13: a local child process, Docker argv, and a file checkpoint."

[lib]
name = "sandbox"

[[bin]]
name = "ch13-sandbox"
path = "src/main.rs"

[[bin]]
name = "sandbox-worker"
path = "src/bin/worker.rs"

[dependencies]

[dev-dependencies]
criterion = { version = "0.5" }

[[bench]]
name = "sandbox"
harness = false
