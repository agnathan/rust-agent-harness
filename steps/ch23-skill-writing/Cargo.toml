[package]
name = "ch23-skill-writing"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Chapter 23: create, patch, and delete skills, with a scanner and an approval gate."

[lib]
name = "skill_write"

[[bin]]
name = "ch23-skill-writing"
path = "src/main.rs"

[dependencies]
ch22-skills = { path = "../ch22-skills" }
regex = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "writing"
harness = false
