[package]
name = "ch51-capstone"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Chapter 51: chapter 42 vendored, plus the three token arms and an in-memory load."

[lib]
name = "gwservice"

[[bin]]
name = "ch51-capstone"
path = "src/main.rs"

[dependencies]
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "capstone"
harness = false
