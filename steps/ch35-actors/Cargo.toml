[package]
name = "ch35-actors"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Chapter 35: one task per agent, a session inbox of 64, and backpressure."

[lib]
name = "actors"

[[bin]]
name = "ch35-actors"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
criterion = "0.5"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[[bench]]
name = "actors"
harness = false
