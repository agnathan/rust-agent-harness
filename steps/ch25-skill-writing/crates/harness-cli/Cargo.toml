[package]
name = "ch25-harness-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[[bin]]
name = "ch25-harness"
path = "src/main.rs"

[dependencies]
ch25-skill-writing = { path = "../harness-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
