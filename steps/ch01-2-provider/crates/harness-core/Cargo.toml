[package]
name = "ch01-2-harness-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "harness_core"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[[bench]]
name = "mock_calls"
harness = false
