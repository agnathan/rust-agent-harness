[package]
name = "ch04-1-harness-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "harness_core"

[[bin]]
name = "mcp_fixture"
path = "src/bin/mcp_fixture.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
rmcp = { version = "3.5.1", features = ["client", "server", "macros", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "process", "sync", "time"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "stdio_call"
harness = false
