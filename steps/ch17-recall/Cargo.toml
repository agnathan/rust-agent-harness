[package]
name = "ch17-recall"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Chapter 20: FTS5 trigram session_search."

[lib]
name = "recall"

[[bin]]
name = "ch17-recall"
path = "src/main.rs"

[dependencies]
ch15-sessions = { path = "../ch15-sessions" }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "recall"
harness = false
