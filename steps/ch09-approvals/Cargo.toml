[package]
name = "ch09-approvals"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Chapter 11: risk levels, an approval pipeline, and one human prompt."

[lib]
name = "approvals"

[[bin]]
name = "ch09-approvals"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[[bench]]
name = "decision"
harness = false
