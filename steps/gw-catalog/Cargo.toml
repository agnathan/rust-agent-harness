[package]
name = "gw-catalog"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Chapter 7: server-side catalog, BM25, and an Arc reload."

[lib]
name = "gw_catalog"

[[bin]]
name = "gw-catalog"
path = "src/main.rs"

[dependencies]
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "catalog"
harness = false
