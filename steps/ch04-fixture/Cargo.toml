[package]
name = "ch04-mcp-fixture"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[[bin]]
name = "mcp_fixture"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
rmcp = { version = "3.5.1", features = ["client", "server", "macros", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "io-std", "net", "process", "sync", "time"] }
