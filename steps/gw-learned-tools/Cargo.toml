[package]
name = "gw-learned-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Chapter 21: learned tool prediction, composite and macro tools, and a code-mode tool."

[lib]
name = "gw_learned"

[[bin]]
name = "gw-learned-tools"
path = "src/main.rs"

[dependencies]
gw-limits = { path = "../gw-limits" }
serde_json = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "learned"
harness = false
