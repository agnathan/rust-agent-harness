[package]
name = "ch44-kanban"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Chapter 44: a durable board and a compare-and-swap claim."

[lib]
name = "kanban"

[[bin]]
name = "ch44-kanban"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "kanban"
harness = false
