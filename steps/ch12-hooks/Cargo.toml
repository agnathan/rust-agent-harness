[package]
name = "ch12-hooks"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Chapter 12: tool hooks, an API-request hook, and a swappable memory queue."

[lib]
name = "hooks"

[[bin]]
name = "ch12-hooks"
path = "src/main.rs"

[dependencies]
ch11-approvals = { path = "../ch11-approvals" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
criterion = { version = "0.5" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[[bench]]
name = "hooks"
harness = false
