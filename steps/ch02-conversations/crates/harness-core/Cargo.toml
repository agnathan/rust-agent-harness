[package]
name = "ch02-harness-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "harness_core"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
