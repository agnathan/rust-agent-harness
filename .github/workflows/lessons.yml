name: Lessons

on:
  workflow_dispatch:
    inputs:
      lessons:
        description: "Lessons to test: 7, 1-5, 3,8,12, or all"
        required: true
        default: all
        type: string
      os:
        description: "Operating systems to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - ubuntu
          - macos
          - windows
  push:
    paths:
      - "starter/harness/src/l0*.rs"
      - "starter/harness/src/l1*.rs"
      - "starter/harness/src/l2*.rs"
      - "starter/harness/tests/l0*.rs"
      - "starter/harness/tests/l1*.rs"
      - "starter/harness/tests/l2*.rs"
      - ".github/workflows/lessons.yml"
      - ".github/scripts/**"
      - "starter/.config/nextest.toml"
  pull_request:
    paths:
      - "starter/harness/src/l0*.rs"
      - "starter/harness/src/l1*.rs"
      - "starter/harness/src/l2*.rs"
      - "starter/harness/tests/l0*.rs"
      - "starter/harness/tests/l1*.rs"
      - "starter/harness/tests/l2*.rs"
      - ".github/workflows/lessons.yml"
      - ".github/scripts/**"
      - "starter/.config/nextest.toml"

jobs:
  plan:
    name: Select lessons
    runs-on: ubuntu-latest
    outputs:
      lessons: ${{ steps.plan.outputs.lessons }}
      has_lessons: ${{ steps.plan.outputs.has_lessons }}
      oses: ${{ steps.plan.outputs.oses }}
      fail_workflow: ${{ steps.plan.outputs.fail_workflow }}
      selection: ${{ steps.plan.outputs.selection }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Choose lessons and operating systems
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          LESSONS_INPUT: ${{ github.event.inputs.lessons }}
          OS_INPUT: ${{ github.event.inputs.os }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/plan_lessons.sh

  test:
    name: ${{ matrix.os }}
    needs: plan
    if: needs.plan.outputs.has_lessons == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.oses) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./starter
      - name: Install cargo-nextest
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Test selected lessons
        id: run
        shell: bash
        env:
          RESULTS_DIR: ${{ github.workspace }}/lesson-results
          LESSONS: ${{ needs.plan.outputs.lessons }}
        run: printf '%s\n' "$LESSONS" | bash .github/scripts/run_lessons.sh
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-results-${{ matrix.os }}
          path: lesson-results
          if-no-files-found: error
      - name: Fail explicit selection
        if: needs.plan.outputs.fail_workflow == 'true' && steps.run.outputs.any_failed == 'true'
        shell: bash
        run: exit 1

  summary:
    name: Lesson summary
    needs: [plan, test]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download results
        if: needs.plan.outputs.has_lessons == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: lesson-results-*
          path: all-results
      - name: Write the lesson by OS table
        shell: bash
        env:
          SELECTION: ${{ needs.plan.outputs.selection }}
          FAIL_WORKFLOW: ${{ needs.plan.outputs.fail_workflow }}
          HAS_LESSONS: ${{ needs.plan.outputs.has_lessons }}
        run: |
          args=(--selection "$SELECTION" --fail-workflow "$FAIL_WORKFLOW" --summary "$GITHUB_STEP_SUMMARY")
          if [[ "$HAS_LESSONS" == "true" ]]; then
            args+=(--expect-results)
          fi
          python3 .github/scripts/summarize_lessons.py all-results "${args[@]}"
