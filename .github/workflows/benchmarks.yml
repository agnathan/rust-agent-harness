name: Benchmarks

# Informational only. Reports Criterion estimates in the job summary,
# uploads one JSON artifact per commit, and charts the series on gh-pages
# when this token is allowed to publish. There are no fail thresholds.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write
  deployments: write

jobs:
  bench:
    name: criterion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Section 1.1 serde
        run: cargo bench -p ch01-1-harness-core --bench serde_messages --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 1.2 mock calls
        run: cargo bench -p ch01-2-harness-core --bench mock_calls --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 1.3 request parse
        run: cargo bench -p ch01-3-harness-core --bench request_parse --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 1.4 response edges
        run: cargo bench -p ch01-4-harness-core --bench edges --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Chapter 2 inbox
        run: cargo bench -p ch02-harness-core --bench inbox --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Write the job summary
        if: always()
        run: python3 .github/scripts/bench_summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the criterion summary
        if: always() && hashFiles('target/criterion-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: criterion-summary-${{ github.sha }}
          path: |
            target/criterion-summary.json
            target/criterion-run.json
      - name: Record the benchmark trend
        if: always() && hashFiles('target/criterion-summary.json') != ''
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Harness criterion
          tool: customSmallerIsBetter
          output-file-path: target/criterion-summary.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          comment-always: true
          summary-always: true
          fail-on-alert: false
          alert-threshold: "200%"
