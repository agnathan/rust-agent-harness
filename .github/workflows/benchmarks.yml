name: Benchmarks

# Informational only. Reports Criterion estimates in the job summary,
# uploads one JSON artifact per commit, and charts the series on gh-pages
# when this token is allowed to publish. There are no fail thresholds.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write
  deployments: write

jobs:
  bench:
    name: criterion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Section 1.1 serde
        run: cargo bench -p ch01-1-harness-core --bench serde_messages --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 1.2 mock calls
        run: cargo bench -p ch01-2-harness-core --bench mock_calls --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 1.3 request parse
        run: cargo bench -p ch01-3-harness-core --bench request_parse --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 1.4 response edges
        run: cargo bench -p ch01-4-harness-core --bench edges --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Chapter 2 inbox
        run: cargo bench -p ch02-harness-core --bench inbox --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 3.1 registry lookup
        run: cargo bench -p ch03-1-harness-core --bench registry --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 3.2 available tools
        run: cargo bench -p ch03-2-harness-core --bench toolset --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 3.3 dispatch
        run: cargo bench -p ch03-3-harness-core --bench dispatch --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 4.1 stdio call
        run: cargo bench -p ch04-1-harness-core --bench stdio_call --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 4.2 http call
        run: cargo bench -p ch04-2-harness-core --bench stdio_call --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 4.3 mcp dispatch
        run: cargo bench -p ch04-3-harness-core --bench stdio_call --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 4.4 tool list cache
        run: cargo bench -p ch04-4-harness-core --bench stdio_call --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 5.1 schema cost
        run: cargo bench -p ch05-1-harness-core --bench schema_cost --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 5.2 tool index
        run: cargo bench -p ch05-2-harness-core --bench tool_index --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 5.3 search tool
        run: cargo bench -p ch05-3-harness-core --bench search_tool --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 5.4 routing
        run: cargo bench -p ch05-4-harness-core --bench routing --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Section 5.5 lazy list
        run: cargo bench -p ch05-5-harness-core --bench lazy_list --locked -- --warm-up-time 1 --measurement-time 2 --sample-size 10
      - name: Write the job summary
        if: always()
        run: python3 .github/scripts/bench_summary.py >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the criterion summary
        if: always() && hashFiles('target/criterion-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: criterion-summary-${{ github.sha }}
          path: |
            target/criterion-summary.json
            target/criterion-run.json
      - name: Record the benchmark trend
        if: always() && hashFiles('target/criterion-summary.json') != ''
        continue-on-error: true
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Harness criterion
          tool: customSmallerIsBetter
          output-file-path: target/criterion-summary.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          comment-always: true
          summary-always: true
          fail-on-alert: false
          alert-threshold: "200%"
