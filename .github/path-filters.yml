# Filter names match steps/ directory names.
# `shared` means "retest every step that exists".
# The chapter plan itself is .github/chapters.json (chapters 0–52, parts I–VI).
# Every step directory is named steps/chNN-<slug>, including the server track.
# There is no steps/ch04-mcp-client directory. Chapter 4 is ch04-1 through ch04-4.
shared:
  - "Cargo.toml"
  - "Cargo.lock"
  - ".github/scripts/**"
  - ".github/workflows/ci.yml"
  - ".github/path-filters.yml"
  - ".github/chapters.json"
