ch06-agents-as-tools:
  - "steps/ch06-agents-as-tools/**"
ch07-when-things-fail:
  - "steps/ch07-when-things-fail/**"
ch08-streaming:
  - "steps/ch08-streaming/**"
ch09-turn-state:
  - "steps/ch09-turn-state/**"
ch10-parallel-tools:
  - "steps/ch10-parallel-tools/**"
ch11-context:
  - "steps/ch11-context/**"
ch12-remembering:
  - "steps/ch12-remembering/**"
ch13-actors:
