# Filter names for real steps match steps/ directory names.
# `shared` means "retest every step that exists". Planned steps are listed so a
# new steps/chNN-* directory is picked up without editing the workflow.
# The chapter plan itself is .github/chapters.json (23 chapters, parts I–IV).
shared:
  - "Cargo.toml"
  - "Cargo.lock"
  - ".github/scripts/**"
  - ".github/workflows/ci.yml"
  - ".github/path-filters.yml"
  - ".github/chapters.json"
ch01-first-contact:
